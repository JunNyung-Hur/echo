name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verify tag matches app version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match app version v$version"
          }

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix src-ui

      - name: Verify source
        run: |
          npm run build --prefix src-ui
          cargo test --locked --manifest-path tools/core-check/Cargo.toml --lib
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Download pinned LGPL FFmpeg
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip'
          $expected = 'c5aa818e5dd38464c286d59c318d932d7cbeba8f31a21228194eb5ef172e7b83'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg checksum mismatch: $actual" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item (Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          Copy-Item (Get-ChildItem ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe

      - name: Build Windows installers
        run: npx tauri build --config src-tauri/tauri.release.conf.json

      - name: Collect installers and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-artifacts/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release-artifacts/
          Get-ChildItem release-artifacts -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content release-artifacts/SHA256SUMS.txt
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release-artifacts/* `
            --repo "${{ github.repository }}" `
            --title "echo ${{ github.ref_name }}" `
            --notes-file docs/public/release-notes/0.0.4.md `
            --verify-tag

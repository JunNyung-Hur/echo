name: Quality checks
on:
  push:
    branches: [main, 'improve/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --prefix src-ui
      - run: npm run build --prefix src-ui
      - run: cargo test --locked --manifest-path tools/core-check/Cargo.toml --lib
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
